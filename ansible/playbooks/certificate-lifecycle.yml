---
- name: Check Grafana certificate expiration
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - ../group_vars/all/secrets.yml

  tasks:
    - name: Check whether Grafana certificate expires within 30 days
      ansible.builtin.command:
        cmd: >
          openssl x509
          -checkend 2592000
          -noout
          -in /etc/ansible/homeLab/homelab-pki/servers/grafana/certs/grafana.cert.pem
      register: grafana_cert_check
      changed_when: false
      failed_when: false

    - name: Show certificate status
      ansible.builtin.debug:
        msg: >-
          Grafana certificate:
          {{ 'Renewal required' if grafana_cert_check.rc == 1 else 'Valid for more than 30 days' }}

    - name: Generate new Grafana private key
      ansible.builtin.command:
        cmd: >
          openssl genrsa
          -out /etc/ansible/homeLab/homelab-pki/servers/grafana/private/grafana-new.key.pem
          2048
      when: grafana_cert_check.rc == 1

    - name: Protect new Grafana private key
      ansible.builtin.file:
        path: /etc/ansible/homeLab/homelab-pki/servers/grafana/private/grafana-new.key.pem
        mode: '0400'
      when: grafana_cert_check.rc == 1

    - name: Generate new Grafana CSR
      ansible.builtin.command:
        cmd: >
          openssl req
          -new
          -sha256
          -key /etc/ansible/homeLab/homelab-pki/servers/grafana/private/grafana-new.key.pem
          -out /etc/ansible/homeLab/homelab-pki/servers/grafana/csr/grafana-new.csr.pem
          -config /etc/ansible/homeLab/homelab-pki/servers/grafana/grafana-csr.conf
      when: grafana_cert_check.rc == 1

    - name: Sign new Grafana certificate with Intermediate CA
      ansible.builtin.command:
        cmd: >
          openssl x509
          -req
          -in /etc/ansible/homeLab/homelab-pki/servers/grafana/csr/grafana-new.csr.pem
          -CA /etc/ansible/homeLab/homelab-pki/intermediate/certs/intermediate-ca.cert.pem
          -CAkey /etc/ansible/homeLab/homelab-pki/intermediate/private/intermediate-ca.key.pem
          -CAcreateserial
          -out /etc/ansible/homeLab/homelab-pki/servers/grafana/certs/grafana-new.cert.pem
          -days 180
          -sha256
          -extfile /etc/ansible/homeLab/homelab-pki/servers/grafana/grafana-cert.ext
          -passin pass:{{ intermediate_ca_passphrase }}
      when: grafana_cert_check.rc == 1
      no_log: true

    - name: Build new Grafana certificate chain
      ansible.builtin.shell:
        cmd: >
          cat
          /etc/ansible/homeLab/homelab-pki/servers/grafana/certs/grafana-new.cert.pem
          /etc/ansible/homeLab/homelab-pki/intermediate/certs/intermediate-ca.cert.pem
          >
          /etc/ansible/homeLab/homelab-pki/servers/grafana/certs/grafana-new-chain.cert.pem
      when: grafana_cert_check.rc == 1

    - name: Update Grafana Kubernetes TLS secret
      ansible.builtin.shell:
        cmd: >
          kubectl create secret tls grafana-tls
          --namespace monitoring
          --cert=/etc/ansible/homeLab/homelab-pki/servers/grafana/certs/grafana-new-chain.cert.pem
          --key=/etc/ansible/homeLab/homelab-pki/servers/grafana/private/grafana-new.key.pem
          --dry-run=client -o yaml |
          kubectl apply -f -
      environment:
        KUBECONFIG: /home/kent/.kube/config
      when: grafana_cert_check.rc == 1

    - name: Verify Grafana HTTPS after certificate renewal
      ansible.builtin.uri:
        url: https://grafana.homelab/api/health
        method: GET
        status_code: 200
        validate_certs: true
      register: grafana_https_check
      retries: 5
      delay: 3
      until: grafana_https_check.status == 200
      when: grafana_cert_check.rc == 1

    - name: Promote new Grafana private key
      ansible.builtin.copy:
        src: /etc/ansible/homeLab/homelab-pki/servers/grafana/private/grafana-new.key.pem
        dest: /etc/ansible/homeLab/homelab-pki/servers/grafana/private/grafana.key.pem
        mode: '0400'
        remote_src: true
      when: grafana_cert_check.rc == 1

    - name: Promote new Grafana certificate
      ansible.builtin.copy:
        src: /etc/ansible/homeLab/homelab-pki/servers/grafana/certs/grafana-new.cert.pem
        dest: /etc/ansible/homeLab/homelab-pki/servers/grafana/certs/grafana.cert.pem
        mode: '0444'
        remote_src: true
      when: grafana_cert_check.rc == 1

    - name: Promote new Grafana certificate chain
      ansible.builtin.copy:
        src: /etc/ansible/homeLab/homelab-pki/servers/grafana/certs/grafana-new-chain.cert.pem
        dest: /etc/ansible/homeLab/homelab-pki/servers/grafana/certs/grafana-chain.cert.pem
        mode: '0444'
        remote_src: true
      when: grafana_cert_check.rc == 1
