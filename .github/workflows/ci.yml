---
name: Homelab CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  yaml-lint:
    name: YAML lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint YAML files
        run: yamllint .

  ansible-check:
    name: Ansible syntax check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ansible

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install --yes ansible

      - name: Display Ansible version
        run: ansible --version

      - name: Syntax-check update playbook
        run: |
          ansible-playbook \
            -i inventories/hosts \
            playbooks/update.yml \
            --syntax-check

  helm-lint:
    name: Helm lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Lint nginx-demo chart
        run: helm lint charts/nginx-demo

      - name: Render nginx-demo chart
        run: helm template nginx-demo charts/nginx-demo
