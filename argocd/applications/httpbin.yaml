---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: httpbin
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/KentThylstrupAdel/HomeLab.git
    targetRevision: main
    path: charts/httpbin

    helm:
      releaseName: httpbin

  destination:
    server: https://kubernetes.default.svc
    namespace: httpbin

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
